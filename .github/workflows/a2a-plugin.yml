name: a2a-plugin

on:
  push:
    paths: ["a2a-plugin/**", ".github/workflows/a2a-plugin.yml"]
  pull_request:
    paths: ["a2a-plugin/**", ".github/workflows/a2a-plugin.yml"]
  # Ejecución manual, para probar una versión de KrakenD antes de adoptarla.
  workflow_dispatch:
    inputs:
      krakend_ce_version:
        description: "Versión de KrakenD Community (vacío: la de versions.env)"
        required: false
        type: string
      krakend_ee_version:
        description: "Versión de KrakenD Enterprise (vacío: la de versions.env)"
        required: false
        type: string

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: Versiones de versions.env
        env:
          CE_INPUT: ${{ inputs.krakend_ce_version }}
          EE_INPUT: ${{ inputs.krakend_ee_version }}
        run: |
          grep -E '^[A-Z_]+=' a2a-plugin/versions.env >> "$GITHUB_ENV"
          if [ -n "$CE_INPUT" ]; then echo "KRAKEND_CE_VERSION=$CE_INPUT" >> "$GITHUB_ENV"; fi
          if [ -n "$EE_INPUT" ]; then echo "KRAKEND_EE_VERSION=$EE_INPUT" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.CI_GO_VERSION }}
      - name: Licencia de Enterprise (opcional, desde un secreto)
        env:
          KRAKEND_EE_LICENSE: ${{ secrets.KRAKEND_EE_LICENSE }}
        run: |
          if [ -n "$KRAKEND_EE_LICENSE" ]; then
            printf '%s' "$KRAKEND_EE_LICENSE" > "$RUNNER_TEMP/krakend-ee.lic"
            echo "KRAKEND_EE_LICENSE_FILE=$RUNNER_TEMP/krakend-ee.lic" >> "$GITHUB_ENV"
          fi
      - name: CI
        env:
          A2A_TEST_REDIS: 127.0.0.1:6379
        run: bash a2a-plugin/scripts/ci.sh
