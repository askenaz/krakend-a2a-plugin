# Análisis de SonarQube del plugin A2A.
# La URL del servidor y el token se pasan con SONAR_HOST_URL y SONAR_TOKEN; nunca
# se escriben aquí. Ver a2a-plugin/scripts/sonar.sh.
sonar.projectKey=krakend-a2a
sonar.projectName=KrakenD A2A plugin
sonar.sourceEncoding=UTF-8

sonar.sources=a2a-plugin
sonar.tests=a2a-plugin
sonar.exclusions=**/*_test.go,**/out/**,**/.secrets/**,**/.scannerwork/**
sonar.test.inclusions=**/*_test.go

# Cobertura de las pruebas unitarias del plugin y su núcleo.
sonar.go.coverage.reportPaths=a2a-plugin/out/coverage/core.out,a2a-plugin/out/coverage/plugin.out
# El entorno de demostración, las herramientas de prueba y el prototipo no son
# parte del producto: se analizan, pero no cuentan para la cobertura.
sonar.coverage.exclusions=a2a-plugin/deploy/**,a2a-plugin/demos/**,a2a-plugin/e2e/**,a2a-plugin/prototype/**,a2a-plugin/config/conformance/**
